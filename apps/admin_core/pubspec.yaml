name: crickflow_admin_core
description: Shared foundation for CrickFlow Super Admin and Admin web panels.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  # Reserved for future admin features (re-add when used):
  # firebase_storage, firebase_messaging, cloud_functions,
  # firebase_analytics, firebase_remote_config
  equatable: ^2.0.7
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  fl_chart: ^0.70.2
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/crickflow-logo.png
    - assets/docs/
