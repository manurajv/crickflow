# CrickFlow Web — Firebase App Hosting
# Independent of root firebase.json (mobile scorecard / App Links hosting).
# Console: set the backend root directory to `crickflow-web`.
# Do not deploy this config with the mobile Hosting site.

runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://crickflow.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDdA6_q5js8nOzpQ593_o56mHi8Zj5C4Zk
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: crickflow-b06bc.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: crickflow-b06bc
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: crickflow-b06bc.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "202403125129"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:202403125129:web:4dd44dbdd13b1def37b358
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-0CQXBNTLZ9
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-0CQXBNTLZ9
    availability:
      - BUILD
      - RUNTIME
