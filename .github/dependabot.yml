version: 2
updates:
  - package-ecosystem: pub
    directory: /apps/admin_core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - admin

  - package-ecosystem: pub
    directory: /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - admin

  - package-ecosystem: pub
    directory: /apps/superadmin
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - admin

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
